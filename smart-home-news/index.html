    function formatDateFull(dateStr) {
      const d = new Date(dateStr);
      const year = d.getFullYear();
      const month = d.getMonth() + 1;
      const day = d.getDate();
      const weekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      return `${year}年${month}月${day}日 ${weekdays[d.getDay()]}`;
    }

    function getWeekNumber(d) {
      const date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
      const dayNum = date.getUTCDay() || 7;
      date.setUTCDate(date.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(date.getUTCFullYear(), 0, 1));
      return Math.ceil((((date - yearStart) / 86400000) + 1) / 7);
    }

    function getWeekRange(dateStr) {
      const d = new Date(dateStr);
      const year = d.getFullYear();
      const week = getWeekNumber(d);
      const firstDay = new Date(year, 0, 1 + (week - 1) * 7);
      const lastDay = new Date(firstDay);
      lastDay.setDate(lastDay.getDate() + 6);
      return `${firstDay.getMonth()+1}/${firstDay.getDate()}-${lastDay.getMonth()+1}/${lastDay.getDate()}`;
    }

    function countDuplicates() {
      const titles = allNews.map(n => n.title);
      const unique = new Set(titles);
      return titles.length - unique.size;
    }

    function getDuplicateCount() { return countDuplicates(); }

    // ============ 数据处理 ============
    function getDailyData() {
      const byDate = {};
      allNews.forEach(n => {
        if (!byDate[n.date]) byDate[n.date] = [];
        byDate[n.date].push(n);
      });
      return byDate;
    }

    function getWeeklyData() {
      const byWeek = {};
      allNews.forEach(n => {
        const d = new Date(n.date);
        const key = `${d.getFullYear()}-W${String(getWeekNumber(d)).padStart(2, '0')}`;
        if (!byWeek[key]) byWeek[key] = [];
        byWeek[key].push(n);
      });
      return byWeek;
    }

    function getMonthlyData() {
      const byMonth = {};
      allNews.forEach(n => {
        const ym = n.date.substring(0, 7);
        if (!byMonth[ym]) byMonth[ym] = [];
        byMonth[ym].push(n);
      });
      return byMonth;
    }

    // ============ Tab 切换 ============
    let currentTab = 'daily';

    document.querySelectorAll('.sidebar-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        currentTab = tab.dataset.tab;
        document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById(`nav-${currentTab}`).classList.add('active');
        document.getElementById(`content-${currentTab}`).classList.add('active');
        updateHeader();
      });
    });

    function updateHeader() {
      const meta = document.getElementById('mainMeta');
      const title = document.getElementById('mainTitle');
      const now = new Date();
      const vol = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
      meta.textContent = `Vol. ${vol}`;
      title.innerHTML = currentTab === 'daily' ? '智慧家庭资讯日报' : currentTab === 'weekly' ? '智慧家庭资讯周报' : '智慧家庭资讯月报';
    }

    // ============ 渲染导航 ============
    function renderNavDaily() {
      const byDate = getDailyData();
      const dates = Object.keys(byDate).sort().reverse();
      const nav = document.getElementById('nav-daily');
      nav.innerHTML = dates.map(d => {
        const dayNames = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        const dd = new Date(d);
        return `
          <div class="nav-item ${d === dates[0] ? 'active' : ''}" data-date="${d}">
            <div class="nav-item-indicator ${byDate[d].length > 0 ? 'has-news' : ''}"></div>
            <div class="nav-item-date">${formatDate(d)}</div>
            <div class="nav-item-day">${dayNames[dd.getDay()]}</div>
          </div>
        `;
      }).join('');

      nav.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
          nav.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          renderDailyContent(item.dataset.date);
        });
      });
    }

    function renderNavWeekly() {
      const byWeek = getWeeklyData();
      const weeks = Object.keys(byWeek).sort().reverse();
      const nav = document.getElementById('nav-weekly');
      nav.innerHTML = weeks.map(w => {
        return `
          <div class="nav-item ${w === weeks[0] ? 'active' : ''}" data-week="${w}">
            <div class="nav-item-indicator has-news"></div>
            <div class="nav-item-date">${w.replace('-W', ' 第')} 周</div>
            <div class="nav-item-week">${getWeekRange(w)}</div>
          </div>
        `;
      }).join('');

      nav.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
          nav.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          renderWeeklyContent(item.dataset.week);
        });
      });
    }

    function renderNavMonthly() {
      const byMonth = getMonthlyData();
      const months = Object.keys(byMonth).sort().reverse();
      const nav = document.getElementById('nav-monthly');
      nav.innerHTML = months.map(m => {
        const [year, month] = m.split('-');
        return `
          <div class="nav-item ${m === months[0] ? 'active' : ''}" data-month="${m}">
            <div class="nav-item-indicator has-news"></div>
            <div class="nav-item-date">${year}年${parseInt(month)}月</div>
          </div>
        `;
      }).join('');

      nav.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
          nav.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
          item.classList.add('active');
          renderMonthlyContent(item.dataset.month);
        });
      });
    }

    // ============ 渲染内容 ============
    function renderDailyContent(date) {
      const byDate = getDailyData();
      const news = byDate[date] || [];
      const container = document.getElementById('content-daily');
      const total = allNews.length;
      const dupCount = getDuplicateCount();

      // 按分类分组
      const categories = {};
      news.forEach(n => {
        if (!categories[n.category]) categories[n.category] = [];
        categories[n.category].push(n);
      });

      const catNames = { tech: '技术前沿', policy: '政策标准', product: '产品方案', scenario: '场景落地', security: '数据安全' };

      let catHtml = '';
      Object.keys(categories).forEach(cat => {
        const items = categories[cat];
        catHtml += `
          <div class="cat-section">
            <div class="cat-header">
              <span class="cat-title">${catNames[cat]}</span>
              <span class="cat-count">${items.length} 条</span>
            </div>
            <div class="news-list">
              ${items.map((item, i) => `
                <div class="news-item">
                  <div class="item-index">${String(i+1).padStart(2,'0')}</div>
                  <div class="item-content">
                    <div class="item-title">${item.title}</div>
                    <div class="item-summary">${item.summary}</div>
                    <div class="item-meta">
                      <span class="card-tag ${item.category}">${item.categoryLabel}</span>
                      <span>📰 ${item.source}</span>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="section-header">
          <div class="section-vol">${formatDateFull(date)}</div>
          <div class="section-title">今日看点</div>
        </div>
        <div class="stats-bar">
          <span class="total">共 ${total} 条</span>
          <span class="divider"></span>
          <span class="dup">（重复 ${dupCount} 条）</span>
          <span class="divider"></span>
          <span class="mode-label">日报</span>
        </div>
        ${catHtml || '<div class="empty-state"><p>暂无数据</p></div>'}
      `;
    }

    function renderWeeklyContent(week) {
      const byWeek = getWeeklyData();
      const news = byWeek[week] || [];
      const container = document.getElementById('content-weekly');
      const total = allNews.length;
      const dupCount = getDuplicateCount();
      const sources = [...new Set(news.map(n => n.source))];

      container.innerHTML = `
        <div class="section-header">
          <div class="section-vol">${week.replace('-W', ' 年 第')} 周</div>
          <div class="section-title">本周资讯汇总</div>
        </div>
        <div class="stats-bar">
          <span class="total">共 ${total} 条</span>
          <span class="divider"></span>
          <span class="dup">（重复 ${dupCount} 条）</span>
          <span class="divider"></span>
          <span class="mode-label">周报</span>
        </div>
        <div class="period-list">
          ${news.map((item, i) => `
            <div class="period-card">
              <div class="period-header">
                <div class="period-title">${item.date} · ${item.categoryLabel}</div>
                <span class="card-tag ${item.category}">${item.categoryLabel}</span>
              </div>
              <div class="period-preview">${item.title}</div>
              <div class="period-footer">
                <span>📰 ${item.source}</span>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderMonthlyContent(month) {
      const byMonth = getMonthlyData();
      const news = byMonth[month] || [];
      const container = document.getElementById('content-monthly');

      const total = allNews.length;
      const dupCount = getDuplicateCount();

      container.innerHTML = \`
        <div class="section-header">
          <div class="section-vol">\${month}</div>
          <div class="section-title">月度资讯汇总</div>
        </div>
        <div class="stats-bar">
          <span class="total">共 \${total} 条</span>
          <span class="divider"></span>
          <span class="dup">（重复 \${dupCount} 条）</span>
          <span class="divider"></span>
          <span class="mode-label">月报</span>
        </div>
        <div class="period-list">
          \${news.map((item, i) => \`
            <div class="period-card">
              <div class="period-header">
                <div class="period-title">\${item.date} · \${item.categoryLabel}</div>
                <span class="card-tag \${item.category}">\${item.categoryLabel}</span>
              </div>
              <div class="period-preview">\${item.title}</div>
              <div class="period-footer">
                <span>📰 \${item.source}</span>
              </div>
            </div>
          \`).join('')}
        </div>
      \`;
    }

    // ============ 在线人数真实统计 ============
    (function initOnlineCounter() {
      const STORAGE_KEY = 'shn_online_v1';
      const SESSION_KEY = 'shn_sid_v1';
      const TTL = 5 * 60 * 1000; // 5分钟过期

      // 生成或恢复会话ID
      let sid = sessionStorage.getItem(SESSION_KEY);
      if (!sid) {
        sid = Math.random().toString(36).substring(2) + Date.now().toString(36);
        sessionStorage.setItem(SESSION_KEY, sid);
      }

      // 更新自己的心跳
      const now = Date.now();
      let store = {};
      try { store = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) {}

      // 清理过期项
      Object.keys(store).forEach(k => { if (now - store[k] > TTL) delete store[k]; });
      store[sid] = now;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(store));

      // 渲染计数
      function render() {
        const count = Object.keys(store).length;
        const el = document.getElementById('onlineCount');
        if (el) el.textContent = count > 0 ? count : 1;
      }
      render();

      // 页面可见时 + 定期刷新计数
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          try {
            let s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            Object.keys(s).forEach(k => { if (now - s[k] > TTL) delete s[k]; });
            s[sid] = Date.now();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
            render();
          } catch(e) {}
        }
      });

      setInterval(() => {
        try {
          let s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
          Object.keys(s).forEach(k => { if (Date.now() - s[k] > TTL) delete s[k]; });
          s[sid] = Date.now();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
          render();
        } catch(e) {}
      }, 30000);
    })();

    // ============ 初始化 ============
    renderNavDaily();
    renderNavWeekly();
    renderNavMonthly();

    // 默认显示第一天
    const byDate = getDailyData();
    const dates = Object.keys(byDate).sort().reverse();
    if (dates.length > 0) {
      renderDailyContent(dates[0]);
    }
    updateHeader();
  </script>
</body>
</html>
